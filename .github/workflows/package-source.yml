name: Package improved source

on:
  push:
    branches:
      - improve-smart-planner

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source zip
        run: |
          zip -r PLDDY-improved-full.zip . -x '.git/*'

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: PLDDY-improved-full
          path: PLDDY-improved-full.zip
          if-no-files-found: error
